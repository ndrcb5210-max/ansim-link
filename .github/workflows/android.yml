name: Android CI

# Firebase 는 아직 쓰지 않는다. google-services.json 없이 빌드된다.
# (2단계에서 Firebase 를 붙이면 가짜 google-services.json 을 만드는 단계를 여기에 넣는다.)

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · 단위 테스트 · 디버그 APK
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        # 래퍼 검증과 빌드 캐시를 함께 처리한다.
        uses: gradle/actions/setup-gradle@v6

      - name: gradlew 실행 권한 주기
        run: chmod +x ./gradlew

      - name: 빌드와 검사
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: debug APK 올리기
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 테스트·lint 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/01/*.png
          if-no-files-found: ignore
