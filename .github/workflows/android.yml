name: Android CI

# 진짜 google-services.json 은 저장소에 없다(CLAUDE.md 원칙 6).
# 빌드만 통과시키려고 자리표시자 설정을 만들어 쓴다. 값이 가짜라 서버에는 연결되지 않고,
# 앱은 '서버 설정이 필요합니다' 안내를 보여 준다.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · 단위 테스트 · 디버그 APK
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        # 래퍼 검증과 빌드 캐시를 함께 처리한다.
        uses: gradle/actions/setup-gradle@v6

      - name: gradlew 실행 권한 주기
        run: chmod +x ./gradlew

      - name: google-services.json 준비
        # 진짜 파일이 이미 있으면 스크립트가 건드리지 않는다.
        run: ./scripts/fake-google-services.sh

      - name: 빌드와 검사
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: debug APK 올리기
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 테스트·lint 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/**/*.png
          if-no-files-found: ignore

  rules:
    name: Firestore 보안 규칙 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: JDK 21 설정
        # Firestore 에뮬레이터가 JVM 위에서 돈다.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 의존성 설치
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      - name: 규칙 테스트
        working-directory: tests/rules
        # 에뮬레이터가 끝나지 않고 매달리면 작업 전체가 6시간 돌 수 있다.
        # 로컬에서 한 번 그런 일이 있었다(docs/devlog/04-share-message.md).
        timeout-minutes: 15
        run: npm test

  functions:
    name: Cloud Functions 빌드·단위 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 의존성 설치
        working-directory: functions
        run: npm install --no-audit --no-fund

      # 배포는 하지 않는다. Blaze 요금제가 필요하다(functions/README.md).
      - name: 타입 검사와 빌드
        working-directory: functions
        run: npm run build

      - name: 단위 테스트
        working-directory: functions
        # 에뮬레이터가 필요 없는 순수 함수 테스트다.
        timeout-minutes: 10
        run: npm test
