# Gradle 데몬 JVM 설정
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# 각 모듈의 R 클래스에 자기 리소스만 담는다(빌드 속도).
android.nonTransitiveRClass=true

kotlin.code.style=official

# Roborazzi: `./gradlew testDebugUnitTest` 만 돌려도 스크린샷 PNG가 기록되게 한다.
# 출력 위치는 app/build.gradle.kts 의 roborazzi { outputDir } 에서 docs/screenshots/01 로 지정한다.
roborazzi.test.record=true
# captureRoboImage("01-home.png") 처럼 파일 이름만 넘겼을 때 기준 경로.
# 기본값(relativePathFromCurrentDirectory)은 테스트 작업 디렉터리인 app/ 에 저장해 버린다.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
