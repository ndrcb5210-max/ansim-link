#
# 버전 카탈로그 — 고른 이유는 docs/devlog/01-scaffold.md 에 적어 두었다.
#
# 핵심 제약: CLAUDE.md가 compileSdk 36 / targetSdk 36 으로 못박고 있다.
# Compose 1.12 부터 AAR 메타데이터가 minCompileSdk=37 을 요구하므로(Google Maven에서 확인),
# compileSdk 36 에서 쓸 수 있는 가장 최신 Compose BOM은 2026.06.01(= ui 1.11.4, minCompileSdk=35)이다.
# 그에 맞춰 AGP·Kotlin·androidx 버전도 compileSdk 36 을 지원하는 선으로 맞췄다.
#
[versions]
# AGP 8.13.2 = 8.x 계열 마지막 안정판. 지원 최대 API 36.1, 최소 Gradle 8.13, 최소 JDK 17.
agp = "8.13.2"
# Compose 컴파일러 플러그인 2.3 이상은 AGP 9.2 이상을 요구한다(ComposeAgpMappingFile).
# Compose 1.11 에는 AGP 9 가 필요 없으므로 Kotlin/Compose 컴파일러를 2.2.x 로 맞춘다.
kotlin = "2.2.21"

# compileSdk 36 에서 쓸 수 있는 마지막 BOM (ui 1.11.4 / material3 1.4.0)
composeBom = "2026.06.01"

# 아래 androidx 버전은 모두 AAR 메타데이터의 minCompileSdk <= 36 을 확인한 것들이다.
androidxCore = "1.18.0"          # 1.19.1 은 minCompileSdk=37
androidxActivity = "1.13.0"      # minCompileSdk=36
androidxLifecycle = "2.10.0"     # 2.11.0 은 minCompileSdk=37
androidxNavigation = "2.9.8"     # 2.10.2 는 minCompileSdk=37

# 2단계에서 추가. 고른 과정은 docs/devlog/02-auth-consent.md 에 적어 두었다.
#
# 여기서는 compileSdk 36 말고 제약이 하나 더 있다. 1단계에서 Kotlin 을 2.2.21 로 묶었는데
# (Compose 컴파일러 플러그인 2.3+ 가 AGP 9.2+ 를 요구해서), Kotlin 2.2 컴파일러는
# .kotlin_module 메타데이터 2.3.0 까지만 읽는다. 최신 Firebase BoM 35.1.0 의
# firebase-auth 25.0.0 은 메타데이터 2.4.0 이라 컴파일이 깨진다.
# 그래서 각 AAR 의 classes.jar 안 META-INF/*.kotlin_module 첫 바이트로 메타데이터 버전을 직접 확인하고,
# 2.3.0 이하인 것 중 가장 최신을 골랐다.
firebaseBom = "34.19.0"          # auth 24.2.0(메타 2.3.0) / firestore 26.6.0(1.9.0) / common 22.2.1(1.9.0)
googleServices = "4.5.0"         # google-services Gradle 플러그인. AGP 8.13.2 에서 동작 확인
androidxCredentials = "1.6.0"    # minCompileSdk=35, 메타데이터 2.1.0
googleid = "1.2.0"               # 1.2.1 은 메타데이터 2.4.0 이라 못 쓴다
coroutines = "1.11.0"            # Task.await() 를 주는 kotlinx-coroutines-play-services

# 3단계에서 추가. 고른 과정은 docs/devlog/03-alert-detection.md 에 적어 두었다.
#
# 1·2단계와 같은 방법으로 확인했다(AAR 의 aar-metadata.properties 로 minCompileSdk,
# classes.jar 안 META-INF/*.kotlin_module 첫 바이트로 Kotlin 메타데이터 버전).
#   room-runtime-android 2.8.5        minCompileSdk=34, 메타데이터 2.1.0
#   datastore-preferences-android 1.3.0  minCompileSdk=34, 메타데이터 2.2.0
#   sqlite-framework-android 2.6.2    minCompileSdk=34 (room 이 끌고 온다)
# 둘 다 compileSdk 36 · Kotlin 2.2.21 에서 쓸 수 있다.
room = "2.8.5"
datastore = "1.3.0"
# KSP 는 Kotlin 버전과 짝이 맞아야 한다. 2.2.21-2.0.5 가 Kotlin 2.2.21 용 최신이다.
ksp = "2.2.21-2.0.5"

# 4단계에서 추가. 고른 과정은 docs/devlog/04-share-message.md 에 적어 두었다.
#
# 같은 방법으로 확인했다.
#   work-runtime-2.12.0.aar             minCompileSdk=35, minAGP=8.6.0, 메타데이터 2.1.0
#   play-services-location-21.4.0.aar   minCompileSdk=1 (자바 라이브러리, kotlin_module 없음)
#   firebase-messaging 25.1.3           minCompileSdk=1, 메타데이터 1.9.0 (BoM 34.19.0 이 정해 준다)
# 셋 다 compileSdk 36 · AGP 8.13.2 · Kotlin 2.2.21 에서 쓸 수 있다.
playServicesLocation = "21.4.0"
work = "2.12.0"

junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
robolectric = "4.17"             # API 23~37 지원
roborazzi = "1.77.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# Firebase 는 BoM 이 버전을 정하므로 개별 라이브러리에 버전을 적지 않는다.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
# 4단계: 그룹 푸시를 받는다. 보내는 쪽은 서버 자격 증명이 필요해 functions/ 에 둔다.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Google 로그인: Credential Manager + Sign in with Google
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# 발동 기록을 담는 로컬 DB. Room 2.7 부터 코루틴(Flow) 지원이 room-runtime 에 들어 있어서
# room-ktx 를 따로 넣지 않는다(room-runtime 2.8.5 가 kotlinx-coroutines-core 를 끌고 온다).
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# 발동 규칙(문자 종류 × 재난 유형)을 담는 설정 저장소.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 4단계: 위치 공유.
# Fused Location Provider. 지도 SDK(maps)는 넣지 않는다 — API 키가 필요하고 커밋할 수 없다.
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# 안심 메시지 발송 요청을 앱이 죽어도 이어서 하게 만든다.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

# Compose 는 BOM이 버전을 정하므로 개별 라이브러리에는 버전을 적지 않는다.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
# Room 의 DAO·DB 구현을 만들어 준다(3단계).
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# app/google-services.json 이 있을 때만 적용한다(app/build.gradle.kts 참고).
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
